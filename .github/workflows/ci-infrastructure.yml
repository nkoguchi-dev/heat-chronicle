name: CI Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/ci-infrastructure.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/ci-infrastructure.yml"

concurrency:
  group: ci-infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Infrastructure validation and mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure
      - name: Initialize without remote state
        working-directory: infrastructure/aws/environments/prod
        run: terraform init -backend=false -lockfile=readonly -input=false
      - name: Validate configuration
        working-directory: infrastructure/aws/environments/prod
        run: terraform validate
      - name: Run offline capacity tests
        working-directory: infrastructure/aws/environments/prod
        run: terraform test -no-color
