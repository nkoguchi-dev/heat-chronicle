name: Secret Detection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "41 21 * * *" # Daily at 06:41 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-detection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup scanner Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install checksum-pinned Gitleaks
        run: python tools/secrets/install.py --bin-dir "${{ runner.temp }}/secret-bin"
      - name: Test offline detection and actual local Git hooks
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/secret-bin/gitleaks
        run: python -m unittest discover -s tools/secrets/tests -v
      - name: Scan all fetched Git history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/secret-bin/gitleaks
          SECRET_SCAN_OUTPUT_DIR: ${{ runner.temp }}/secret-report
        run: bash tools/secrets/scan.sh history
      - name: Preserve sanitized scan summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: secret-detection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secret-report/summary.json
          retention-days: 7
          if-no-files-found: error
