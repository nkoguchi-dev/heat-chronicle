name: Code Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "23 21 * * *" # Daily at 06:23 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Python and TypeScript security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout pinned public rules
        uses: actions/checkout@v7
        with:
          repository: semgrep/semgrep-rules
          ref: 17e31e11ebac99fb7dfe1cd288f7a32151b6f3f9
          path: .security-rules
          persist-credentials: false
      - name: Setup Python for scanner
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned scanner
        run: python -m pip install -r tools/security/requirements.txt
      - name: Test security gate and detection fixtures
        env:
          SECURITY_RULES_DIR: ${{ github.workspace }}/.security-rules
        run: python -m unittest discover -s tools/security/tests -v
      - name: Analyze Python and TypeScript
        run: >-
          python tools/security/scan.py
          --rules-dir .security-rules
          --output-dir "${{ runner.temp }}/code-security"
      - name: Preserve public scan summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/code-security/summary.json
          retention-days: 7
          if-no-files-found: error
