name: CI Backend

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit-test:
    name: Backend lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.0"
          python-version: "3.14"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Check formatting
        working-directory: backend
        run: uv run --locked black --check .
      - name: Check import order
        working-directory: backend
        run: uv run --locked isort --check-only .
      - name: Lint
        working-directory: backend
        run: uv run --locked flake8 .
      - name: Type check
        working-directory: backend
        run: uv run --locked mypy .
      - name: Check local development command contract and lifecycle
        working-directory: backend
        run: |
          uv run --locked black --check ../tools/development.py ../tools/tests
          uv run --locked isort --check-only ../tools/development.py ../tools/tests
          uv run --locked flake8 ../tools/development.py ../tools/tests
          uv run --locked mypy ../tools/development.py ../tools/tests
          uv run --locked pytest ../tools/tests/ -v
      - name: Run unit tests
        working-directory: backend
        run: uv run --locked pytest tests/ -v

  integration-test:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-unit-test
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000/ || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.0"
          python-version: "3.14"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Run integration tests
        working-directory: backend
        run: uv run --locked pytest integration_tests/ -v
        env:
          DYNAMODB_ENDPOINT_URL: http://localhost:8000
          DYNAMODB_TABLE_PREFIX: test-ci

  development-image:
    name: Backend development image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and smoke test with an isolated DynamoDB Local
        run: sh tools/run-backend-development-smoke.sh
