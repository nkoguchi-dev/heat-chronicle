services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: heat-dynamodb
    user: root
    ports:
      - "8001:8000"
    volumes:
      - ./database/data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    healthcheck:
      test: ["CMD", "curl", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    container_name: heat-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - dynamodb-local
