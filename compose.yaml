services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: heat-dynamodb
    user: root
    ports:
      - "8001:8000"
    volumes:
      - ./database/data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    healthcheck:
      test: ["CMD", "curl", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
