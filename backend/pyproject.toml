[project]
name = "heat-chronicle-backend"
version = "0.1.0"
description = "Heat Chronicle Backend"
readme = "README.md"
authors = [{name = "nkoguchi"}]
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<0.162",
  "uvicorn[standard]>=0.32,<0.55",
  "boto3>=1.35.0,<2.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "httpx>=0.28.0,<0.29.0",
  "beautifulsoup4>=4.12.0,<5.0.0",
  "lxml>=5,<7",
  "mangum>=0.21,<0.23"
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0.0",
  "pytest-asyncio>=0.24,<1.5",
  "pytest-cov>=6,<8",
  "httpx>=0.28.0,<0.29.0",
  "black>=24.10,<27.0",
  "isort>=8.0.1,<10.0.0",
  "flake8>=7.1.0,<8.0.0",
  "mypy>=2.3.0,<3.0.0",
  "moto[dynamodb]>=5.0.0,<6.0.0",
  "types-boto3[dynamodb]>=1.35.0,<2.0.0"
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ['py314']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "integration_tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
