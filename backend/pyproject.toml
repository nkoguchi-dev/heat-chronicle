[project]
name = "heat-chronicle-backend"
version = "0.1.0"
description = "Heat Chronicle Backend"
readme = "README.md"
authors = [{name = "nkoguchi"}]
requires-python = ">=3.15.2,<3.16"
dependencies = [
  "fastapi>=0.165.0,<0.166.0",
  "uvicorn[standard]>=0.54.0,<0.55",
  "boto3>=1.44.12,<2.0.0",
  "pydantic>=2.14.4,<3.0.0",
  "pydantic-settings>=2.16.3,<3.0.0",
  "httpx>=0.29.0,<0.30.0",
  "beautifulsoup4>=4.15.0,<5.0.0",
  "lxml>=6.1.3,<7",
  "mangum>=0.22.0,<0.23"
]

[dependency-groups]
dev = [
  "pytest>=9.2.0,<10.0.0",
  "pytest-asyncio>=1.5.0,<2.0.0",
  "pytest-cov>=7.1.0,<8",
  "httpx>=0.29.0,<0.30.0",
  "black>=26.10.1,<27.0",
  "isort>=9.0.2,<10.0.0",
  "flake8>=7.5.0,<8.0.0",
  "mypy>=2.4.1,<3.0.0",
  "moto[dynamodb]>=5.2.6,<6.0.0",
  "types-boto3[dynamodb]>=1.44.12,<2.0.0"
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ['py315']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "integration_tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.15"
strict = true
ignore_missing_imports = true
